# Short definitions for {{< tooltip >}} (layouts/shortcodes/tooltip.html), keyed by
# anchorized term. Keep each under ~20 words so hover cards stay readable on phones.
# Longer entries live on /glossary/ (content/page/glossary/index.md).

# Commentators and texts
rashi: "Rabbi Shlomo Yitzchaki (1040–1105) of Troyes, whose line-by-line commentary on Tanach and Talmud is the standard starting point."
ramban: "Rabbi Moshe ben Nachman (Nachmanides, 1194–1270), Catalan Torah commentator, Talmudist and kabbalist."
chazal: "The Sages of the Mishnah and Talmud; an acronym for “our Sages, of blessed memory.”"
rebbe-yehuda-hanasi: "Rabbi Yehudah HaNasi, editor of the Mishnah, referred to in the Talmud simply as “Rebbe.”"
tanach: "The Hebrew Bible: an acronym of Torah, Nevi'im (Prophets) and Ketuvim (Writings)."
chumash: "The Five Books of Moses in printed form, usually with commentaries."
parsha: "The weekly Torah portion read in synagogue; *Parshas* Eikev is the portion called Eikev."
talmud: "The Mishnah with the Gemara's discussion of it: the central text of rabbinic law and thought, mostly in Aramaic."
gemara: "The rabbis' extended discussion of the Mishnah; together the two make up the Talmud."
midrash: "Rabbinic interpretation of Scripture through exposition, narrative and parable; also the books that collect it."
shema: "The declaration “Hear, O Israel” (Deuteronomy 6:4–9), recited every morning and evening."
zohar: "The central work of Kabbalah, a mystical commentary on the Torah that surfaced in 13th-century Spain."
sefer: "A book of Torah literature; literally “book.”"
teshuva-responsum: "A responsum: a rabbi's written answer to a question of Jewish law."

# Practice and community
hashem: "Literally “the Name”: a reverent way of referring to God."
halacha: "Relating to halacha, Jewish law as derived from the Written and Oral Torah."
kabbalah: "Kabbalah: the Jewish mystical tradition, whose central text is the Zohar."
chassidus: "Hasidism: the pietist movement founded in 18th-century Ukraine by the Baal Shem Tov, organized around rebbes."
hasidic: "Belonging to Hasidism, the pietist movement founded in 18th-century Ukraine and organized around rebbes."
rebbe: "The leader of a Hasidic community; also what a student calls his own Torah teacher."
shabbos: "The Sabbath, from Friday sunset to Saturday nightfall."
davening: "Yiddish for praying, especially the set daily prayers."
shul: "Yiddish for synagogue."
tefillin: "Leather boxes holding Torah passages, worn on the arm and head during weekday morning prayers."
mussar: "Jewish ethical literature, and the practice of deliberately working on one's character."
teshuvah: "Repentance; literally “return.”"
elul: "The month before Rosh Hashanah, set aside for introspection and repentance."
yahrzeit: "The anniversary of a death, kept on its Hebrew calendar date."
aliyah-neshama: "“May his soul have an aliyah”: a prayer that the soul of the departed rise higher."
yeshiva: "An academy for advanced Torah and Talmud study."
rosh-yeshiva: "The head of a yeshiva and its senior Talmud lecturer."
mashgiach: "The yeshiva's spiritual supervisor, responsible for the students' character and growth in mussar."
kollel: "A Talmud academy for married men, usually with a stipend."
shiur: "A Torah lecture or class."
chavrusa: "A study partner; Talmud is traditionally learned in pairs."

# Languages
aramaic: "A Northwest Semitic language on a sister branch to Hebrew; long contact also shaped Mishnaic Hebrew. Parts of Daniel and most of the Talmud are Aramaic."
ladino: "Judeo-Spanish: the language of Sephardi Jews descended from those expelled from Spain, traditionally written in Hebrew script."
yishuv: "The Jewish community in the Land of Israel before the founding of the state in 1948."
levantine: "The spoken Arabic dialects of Syria, Lebanon, Jordan and Israel, including Judea and Samaria, also called Shami."
darija: "Spoken Moroccan Arabic, distinct from Modern Standard Arabic."
derja: "Spoken Tunisian Arabic, distinct from Modern Standard Arabic."
msa: "Modern Standard Arabic: the formal Arabic of writing, news and speeches, shared across the Arab world but nobody's native dialect."
judeo-arabic: "Arabic as spoken and written by Jewish communities in the Middle East and North Africa, traditionally in Hebrew script."

# History and genealogy
talne: "A town in central Ukraine, home of the Shore and Saranduk families and seat of the Talne Hasidic dynasty."
djerba: "An island off southern Tunisia, home to one of the oldest continuous Jewish communities in North Africa."
pale-of-settlement: "The western region of the Russian Empire where Jews were, with few exceptions, required to live (1791–1917)."
shtetl: "A small Eastern European market town with a large Jewish population."
naturalization: "The legal process by which an immigrant becomes a citizen; its paperwork often records birth dates and hometowns."
ellis-island: "New York's main immigration station (1892–1954), whose ship manifests are a core genealogy source."

# Tools
obsidian: "A note-taking app that keeps notes as plain Markdown files on your own device."
markdown: "A plain-text format that uses simple marks such as `#` and `*` for headings and emphasis."
anki: "A free flashcard app that schedules reviews by spaced repetition."
spaced-repetition: "Reviewing material at gradually increasing intervals, timed for just before you would forget it."
cloze: "A fill-in-the-blank exercise: a word is hidden from a sentence and you supply it."

# Added for piety-creep
mekubalim: "Kabbalists: scholars and practitioners of Kabbalah, the Jewish mystical tradition."
avodah: "Divine service: prayer and religious practice understood as serving God."
middat-chasidut: "A measure of piety: conduct beyond what the law requires, praised but not obligatory."
tzitzit: "The fringes the Torah requires on the corners of a four-cornered garment (Numbers 15:38)."
sugya: "A self-contained passage or debate in the Talmud."
kavana: "Concentration and intention, especially in prayer."
pesukei-dezimra: "“Verses of song”: the psalms and praises said before the core of the morning service."
korbanot: "Passages about the Temple offerings, recited at the start of the morning service."
minhag: "Custom: an established communal practice, which carries its own weight in Jewish law."
litvak: "A Lithuanian-style Jew; here, the analytical yeshiva tradition that came out of Lithuania."
yotzei: "Having fulfilled an obligation. To be yotzei by every opinion is to satisfy all of them."
poskim: "Halachic decisors: the authorities whose rulings define practice."
siddur: "The Jewish prayer book."
bach: "Rabbi Yoel Sirkis (1561–1640), known by the acronym of his commentary on the Tur, *Bayit Chadash*."
rema: "Rabbi Moshe Isserles (c. 1530–1572) of Kraków, whose glosses on the Shulchan Aruch record Ashkenazi practice."
shach: "Rabbi Shabsai HaKohen (1621–1662), whose commentary on the Shulchan Aruch is known by its acronym, Shach."
maharshal: "Rabbi Shlomo Luria (1510–1574), Polish Talmudist and halachic authority."
tosafot: "Medieval Talmud commentators of France and Germany (12th–14th centuries), printed alongside Rashi."
shulchan-aruch: "The code of Jewish law by Rabbi Yosef Karo (1565), with the Rema's Ashkenazi glosses."
rav-tzadok: "Rabbi Tzadok HaKohen of Lublin (1823–1900), Hasidic thinker and author of *Tzidkat HaTzadik*."

# Added for do-you-speak-moabite
phoenician: "The Canaanite language of Tyre, Sidon and Byblos; also the alphabet from which Hebrew, Aramaic and Greek scripts descend."
ktav-ashuri: "The square Hebrew script, developed from the Aramaic alphabet; the script of Torah scrolls today."
abjad: "A writing system whose letters record consonants, leaving most vowels for the reader to supply."
matres-lectionis: "“Mothers of reading” (*imos hakriah*): letters such as ו and י used to mark vowels."
nikud: "The system of dots and dashes written around Hebrew letters to mark vowels."
kemosh: "The national god of Moab, named in Tanach and on the Mesha Stele."
mishnah: "The first written code of the Oral Torah, edited around 200 CE by Rabbi Yehudah HaNasi."
zevachim: "The Mishnah and Talmud tractate on animal offerings; its last chapter covers sacrifice outside the Temple."
bamah: "In Tanach, a high place of worship; in rabbinic usage, an altar outside the Temple (pl. *bamos*)."
canaanite-languages: "The Northwest Semitic branch that includes Hebrew, Phoenician, Moabite, Ammonite and Edomite."

# Added for what-parents-pass-down
tzidkat-hatzaddik: "*Tzidkat HaTzaddik* (“The Righteousness of the Righteous”): Rav Tzadok's book of short numbered teachings on spiritual life."
otiyot: "Literally “letters”: the numbered paragraphs of a book like *Tzidkat HaTzaddik*; singular *os*."
yisrael: "Israel: the name Yaakov (Jacob) received after wrestling the angel (Genesis 32:29), and so the name of his descendants."
tzaddik: "A righteous person; tradition calls Yosef (Joseph) *the* tzaddik."
chassid: "A pious person who goes beyond what the law requires; David calls himself one (Psalms 86:2)."
tahara: "Ritual purity."
kedusha: "Holiness: being set apart for God."
kohen: "A priest: a male descendant of Aharon (Aaron), Moshe's brother and the first high priest (pl. *kohanim*)."
epigenetics: "Heritable changes in how genes are expressed, without any change to the DNA itself."
beshem-yisrael-yechaneh: "“And shall surname himself by the name of Israel” (Isaiah 44:5), read as a reference to converts."
ger: "A convert to Judaism (pl. *gerim*)."
avodah-zarah: "Literally “strange worship”: idolatry."
kinui: "A by-name or epithet: what someone is called, as distinct from what he is."
zera-yisrael: "“Seed of Israel”: someone of Jewish descent, typically through the father, who is not Jewish by halacha."
shevatim: "The tribes of Israel, each descended from one of Yaakov's sons."
middot: "Character traits (sing. *middah*); here, the particular spiritual bent of a person or group."
moshe-rabbeinu: "“Moshe our teacher”: Moses, through whom the Torah was given."
chochma: "Wisdom."
talmid-chacham: "Literally “a student of a wise man”: a Torah scholar (pl. *talmidei chachamim*; abbreviated ת״ח)."
maalah: "A spiritual quality or attainment; literally “a step up” (pl. *maalot*)."
av-batorah: "A father in Torah: a teacher, counted as a parent to the students he teaches."
hergel: "Habit: what one acquires by living around someone, as opposed to what one is born with."
toldah: "Birth or innate nature: what one is born with, as opposed to what one acquires by habit."

# Added for tabnit-sarcophagus
semitic-languages: "The language family that includes Hebrew, Arabic, Aramaic, Phoenician and the Ethiopian languages such as Amharic."
canaanite: "Of Canaan, the ancient southern Levant of the Phoenicians, Israelites, Moabites and their neighbors."
samaritans: "A small community descended from northern Israelites, with their own Torah and script, living at Mount Gerizim and in Holon."
etruscan: "The pre-Roman language of central Italy, written in an alphabet borrowed from Greek and passed on to Latin."
nabataean: "The Aramaic dialect and script of the Nabataean kingdom of Petra; the script developed into the Arabic alphabet."
syriac: "The Aramaic dialect of Edessa, and the literary and liturgical language of Syriac Christianity."
mandaic: "The Aramaic dialect of the Mandaeans, a small Gnostic religious community from southern Iraq and Iran."
safaitic: "Ancient North Arabian inscriptions, mostly graffiti, left by nomads in the basalt desert of southern Syria and Jordan."
amharic: "The main language of Ethiopia and, after Arabic, the most widely spoken Semitic language, written in the Ge'ez script."
tigrinya: "A Semitic language of Eritrea and northern Ethiopia, written in the Ge'ez script."
maltese: "The national language of Malta: descended from Arabic, written in the Latin alphabet, with heavy Italian borrowing."
modern-south-arabian: "Semitic languages such as Mehri and Soqotri, spoken in Yemen, Oman and on Socotra; related to Arabic but not descended from it."
tabnit: "King of Sidon in the late 6th century BCE, son of Eshmunazar I and father of Eshmunazar II."
sarcophagus: "A stone coffin, often carved or inscribed."
sidon: "A Phoenician port city on the coast of Lebanon, south of Beirut."
wispr-flow: "A dictation app that turns speech into text."
astarte: "The great Phoenician goddess (Ashtart; Hebrew עשתרת, Ashtoreth), called “the goddess of the Sidonians” in 1 Kings 11:5."
eshmunazar: "Eshmunazar I, Tabnit's father and an earlier king of Sidon; Tabnit's son, Eshmunazar II, has a famous inscribed sarcophagus too."
zeh: "Hebrew זה, “this.”"
zayin: "The Hebrew letter ז (z)."
heh: "The Hebrew letter ה (h); at the end of a word it often just marks a vowel."
aleph: "The Hebrew letter א, a glottal stop; often silent and used as a vowel carrier."
yod: "The Hebrew letter י (y); often used to mark an i or e vowel."
asher: "Hebrew “who, which, that”: the relative pronoun."
et: "Hebrew marker of a definite direct object, with no English equivalent; also a preposition, “with.”"
al: "Hebrew “on, above.”"
charutz: "A poetic word for gold in Tanach (Proverbs, Psalms, Zechariah)."
rephaim: "In Tanach and Phoenician inscriptions, the shades of the dead (as in Isaiah 26:14); elsewhere also a people of giants."
kun: "The Hebrew root כ־ו־ן, “to establish, make firm”; also the root of *nachon*, “correct.”"
false-friend: "A word that looks or sounds like one in another language but means something different."
biblical-hebrew: "The Hebrew of Tanach, as distinct from the Mishnaic Hebrew of the rabbis and Modern Hebrew."

# Added for rav-tzadok-success-is-not-proof
cheshbon: "An account or reckoning: the reasoning by which someone justifies what he does."
bilaam: "Balaam, the non-Israelite prophet hired to curse Israel, who ended up blessing it (Numbers 22–24)."
eliyahu: "The prophet Elijah, who declared a drought on King Achav's Israel and then hid from him (1 Kings 17–18)."
achav: "Ahab, king of the northern kingdom of Israel and Eliyahu's great adversary."
oven-of-achnai: "The Talmud's dispute (Bava Metzia 59b) in which the sages overrule Rabbi Eliezer despite his miracles and a heavenly voice."
rabbi-eliezer: "Rabbi Eliezer ben Hyrcanus, a leading sage of the late first century CE."
korach: "Moshe's cousin, who led a rebellion against Moshe and Aharon and was swallowed by the earth (Numbers 16)."
aharon: "Aaron, Moshe's brother and the first high priest."
chutzpah: "Audacity, nerve."
ramchal: "Rabbi Moshe Chaim Luzzatto (1707–1746), Italian kabbalist and ethicist, author of *Mesillat Yesharim* and *Derech Hashem*."
derech-hashem: "“The Way of God”: Ramchal's systematic account of God, providence and the purpose of creation."
mesillat-yesharim: "“The Path of the Just”: Ramchal's mussar classic, climbing step by step from watchfulness to holiness."
mesirat-nefesh: "Literally “handing over the soul”: self-sacrifice, from giving up what you want to giving up your life."
schlep: "Yiddish: a tiresome trek or chore."
mitzvah: "A commandment; loosely, a good deed."
satan: "The Satan: in Jewish thought the accuser or tempter, acting within God's will rather than as an independent power."
yonah: "The prophet Jonah, who fled from his mission to Nineveh."
nefilat-apayim: "“Falling on the face”: resting one's head on the arm during Tachanun."
tachanun: "Supplications said after the Amidah on most weekdays."
rashei-sanhedraot: "Heads of Sanhedrins: leaders of the high courts of Torah law."
mizbeach: "The altar of the Mishkan, and later of the Temple."
techelet: "The blue dye the Torah requires for one thread of the tzitzit (Numbers 15:38)."
mezuzah: "A parchment of Torah verses fixed to a doorpost (Deuteronomy 6:9)."
nefesh: "Soul, life, self; here also what drives a person."
peshat: "The plain, contextual meaning of a verse; *peshuto shel mikra* is “the plain sense of Scripture.”"
chotim: "Sinners."
whitmans-sampler: "An American boxed assortment of chocolates."

# Added for ugaritic
ugaritic: "The language of Ugarit on the Syrian coast, written in an alphabetic cuneiform on clay tablets (c. 14th–12th century BCE)."
ugarit: "A Late Bronze Age trading kingdom on the Syrian coast near Latakia, at the site now called Ras Shamra."
hittite: "Of the Hittites, the Anatolian empire that dominated northern Syria, Ugarit included, in the Late Bronze Age."
baal-cycle: "Ugaritic poems about the storm god Baal: his kingship and his battles with Yamm (Sea) and Mot (Death)."
northwest-semitic: "The Semitic branch that includes the Canaanite languages (Hebrew, Phoenician, Moabite), Aramaic and Ugaritic."
moabite: "The Canaanite language of Moab, east of the Dead Sea, known mainly from the Mesha Stele (9th century BCE)."
mishnaic-hebrew: "The Hebrew of the Mishnah and early rabbinic literature, distinct in vocabulary and grammar from Biblical Hebrew."
cuneiform: "Writing made of wedge-shaped marks pressed into clay; Ugaritic used it for an alphabet of thirty letters."
rs-number: "A Ras Shamra excavation number, identifying a find from Ugarit by dig season and object."
ktu: "*Keilalphabetische Texte aus Ugarit*, the standard edition of Ugaritic texts; its numbers group the texts by genre."
rav-kohanim: "Hebrew רב כהנים, “chief of the priests”; in Ugaritic, *rb khnm*."
rgm: "Ugaritic *rgm*. In Hebrew, the root רגם means to stone."
sabaic: "The ancient language of Saba (Sheba) and later Ḥimyar in Yemen, written in the South Arabian script."
gshm-adr: "Ugaritic *gšm ʾadr*. To a Hebrew reader: גשם, rain, and אדר, the month of Adar."
adar: "The Hebrew month that falls around February–March, near the end of the rainy season."
geshem-adir: "Hebrew גשם אדיר, “mighty rain.”"
ilm: "Ugaritic *ʾilm*, “the gods”; compare Hebrew אלים and אלהים."
mtsrm: "Ugaritic *mṣrm*, Egypt; Hebrew מצרים."
shemen: "Ugaritic *šmn*, “oil”; Hebrew שמן."
torah: "The Five Books of Moses; more broadly, the whole body of Jewish teaching."
syria: "The modern country on the eastern Mediterranean; Ugarit lay on its northern coast."
latakia: "Syria's main port; the ruins of Ugarit, at Ras Shamra, lie about ten kilometers to the north."
late-bronze-age: "Roughly 1550–1200 BCE: the age of Ugarit and the Hittite and Egyptian empires, ending in widespread collapse."
house-of-the-high-priest: "A large house on Ugarit's acropolis, between the temples of Baal and Dagan, where many tablets and bronze tools were found."
tyre: "A Phoenician port city on the coast of southern Lebanon, one of the great trading cities of antiquity."
egypt: "The great power to Ugarit's south; in Hebrew מצרים, in Ugaritic *mṣrm*."

# Added for the intelligibility ratings
machlokes: "A dispute between Torah authorities, each side holding its own reasoned position (pl. *machlokos*)."

# Added for already-decreed
madrega: "A spiritual level or rung (pl. *madregot*)."
shadal: "Shmuel David Luzzatto (1800–1865) of Padua: Italian Jewish scholar, poet, grammarian and Bible commentator."
rishonim: "The medieval rabbinic authorities (c. 11th–15th century) before the *Shulchan Aruch*; literally “the first ones.”"
origen: "Origen of Alexandria (c. 185–253), early Christian scholar who compiled the *Hexapla*, a six-column edition of the Hebrew Bible."
vikuach: "Shadal's *Vikuach al Chokhmat HaKabbalah* (“Dialogue on the Wisdom of Kabbalah,” 1852), arguing that the Zohar is a late composition."
taamim: "The cantillation marks written with the biblical text, governing its chant and phrasing."
kotzk: "The Hasidic court of Rabbi Menachem Mendel of Kotzk (1787–1859), famous for its uncompromising demand for truth."
chabad: "The Hasidic movement founded by Rabbi Shneur Zalman of Liadi (1745–1812), known for its intellectual system of Hasidic thought."
leit-machshava: "Aramaic, from the *Tikkunei Zohar*: “No thought can grasp Him at all.”"
mittler-rebbe: "Rabbi Dovber Schneuri (1773–1827), the second Chabad Rebbe; *mittler* is Yiddish for “middle.”"
elokut: "Godliness: the divine, as an object of contemplation in Hasidic thought."
karkafta: "Aramaic: “a skull that has not put on tefillin,” the Talmud's term (Rosh Hashanah 17a) for a Jew who never wore them."
lechol-davar: "“For everything, prayer is needed.”"
rosh-hashanah: "The Jewish New Year, on which, the Mishnah says, the world is judged."
yom-kippur: "The Day of Atonement, ten days after Rosh Hashanah, when the year's judgment is sealed."
rabbi-yossi: "Rabbi Yossi ben Chalafta, 2nd-century sage, who holds that a person is judged every day (Rosh Hashanah 16a)."
bakashot: "Requests, petitions; the middle blessings of the Amidah are its *bakashot*."
rav-natan: "Rabbi Natan Sternhartz of Nemirov (1780–1844), Rabbi Nachman of Breslov's student and scribe, author of *Likkutei Halakhot*."
likkutei-halakhot: "Rav Natan's multi-volume work reading the laws of the *Shulchan Aruch* through Rabbi Nachman's teachings."
kelim: "Vessels (sing. *keli*); in Hasidic and kabbalistic thought, the containers through which divine flow can be received."
shefa: "Abundance: the flow of divine blessing into the world."
bracha: "A blessing (pl. *brachot*)."
refaeinu: "“Heal us”: the Amidah's blessing for the sick."
rabbi-elazar-kenig: "Rabbi Elazar Mordechai Kenig, leader of the Breslov community in Tzfat (Safed)."
ki-ata-tov: "“For You, Lord, are good and forgiving” (Psalms 86:5), said in Tachanun and Selichot."
tallit: "The fringed prayer shawl worn during morning prayers."
shacharit: "The morning prayer service."
chatati-negdi: "“My sin is always before me” (Psalms 51:5), from David's psalm of repentance."
arizal: "Rabbi Yitzchak Luria (1534–1572) of Safed, the founding figure of later Kabbalah."
gan-eden: "The Garden of Eden; in rabbinic thought also the realm where souls are rewarded after death."
rabbi-nachman: "Rabbi Nachman of Breslov (1772–1810), Hasidic master and great-grandson of the Baal Shem Tov."
yerida-letzorech-aliya: "“Descent for the sake of ascent”: a fall that makes a greater rise possible."
mashal: "A parable told to illustrate a point (pl. *meshalim*)."
baalei-mussar: "Masters of *mussar*: teachers and practitioners of deliberate work on character."
agmat-nefesh: "Anguish; literally “grief of the soul.”"
gehinnom: "The place or process of punishment after death, usually understood as purifying and temporary."
tannaim: "The sages of the Mishnah (c. 10–220 CE); singular *tanna*."
ruach-hakodesh: "The holy spirit: divine inspiration short of full prophecy."
izhbitzer: "Rabbi Mordechai Yosef Leiner of Izbica (1801–1854), author of *Mei HaShiloach*, student of the Kotzker Rebbe and teacher of Rav Tzadok."
kippah: "The skullcap worn by observant Jewish men."
tzfat: "Safed, a hill town in the Galilee, center of 16th-century Kabbalah and home to a large Breslov community."
breslover: "A follower of Rabbi Nachman of Breslov."
aveira: "A sin, a transgression (pl. *aveirot*)."
zedonot-kezechuyot: "“Deliberate sins become like merits” (Yoma 86b): what teshuva out of love achieves."

# Added for aramaic-intro
sephardi: "Of the Jews of Spanish and Portuguese descent; loosely, of Middle Eastern and North African Jewry as well."
ashkenazi: "Of the Jews of Central and Eastern European descent."
targum: "An Aramaic translation of the Bible, such as Targum Onkelos on the Torah (pl. *targumim*)."
talmud-bavli: "The Babylonian Talmud, compiled in the academies of Babylonia (c. 500 CE): the Talmud usually studied."
yerushalmi: "The Jerusalem Talmud, compiled in the Land of Israel (c. 400 CE) in a western Aramaic dialect."
neo-aramaic: "The Aramaic languages still spoken today by Jewish, Christian and Mandaean communities, mostly from Iraq, Iran, Turkey and Syria."
sureth: "What many speakers call their Northeastern Neo-Aramaic, spoken by Assyrian and Chaldean Christians."
chaldeans: "Chaldean Catholics: an Eastern Christian community from northern Iraq, many of whom speak Neo-Aramaic."
peshitta: "The standard Syriac translation of the Bible, made in the early centuries CE."
ketav-ivri: "The Paleo-Hebrew script: the older Hebrew alphabet, close to Phoenician, used before the square script."
mishloach-manot: "Gifts of food sent to friends on Purim."
barta: "Aramaic בַּרְתָּא, “daughter.”"

# Added for king-arrives-quietly
raash: "Noise, tumult; in 1 Kings 19, the earthquake."
rav-sheshet: "A blind Babylonian sage of the late third and early fourth centuries, renowned for his command of the Mishnah and baraitot."
semicha: "Rabbinic ordination."
shas: "The Talmud as a whole; an acronym of *shisha sedarim*, the six orders of the Mishnah."
bava-batra: "A tractate of the Talmud on property, inheritance and partnership."
sichon: "Sihon, the Amorite king whose capital was Cheshbon; Israel defeated him on the way to Canaan (Numbers 21)."
moav: "Moab, the kingdom east of the Dead Sea."
yetzer-hara: "The evil inclination: the drive in each person toward sin; its counterpart is the *yetzer tov*, the good inclination."
lashon-hara: "Derogatory speech about another person, even when true."
david-hamelech: "King David, by tradition the author of most of Psalms."
yiddishkeit: "Jewishness: Jewish religious life and practice, in the Yiddish-inflected sense of the word."

# Added for old-aramaic
old-aramaic: "The earliest stage of Aramaic, written by the city-states of Syria from roughly the tenth to the eighth century BCE."
zakkur: "A basalt stele of about 800 BCE in which Zakkur, king of Hamath and Luash, credits his god with saving him from a siege; now in the Louvre."
sefire: "Three eighth-century BCE steles from Sefire, near Aleppo, recording treaties between Bar-Gaʾyah of KTK and Matiʿel of Arpad."
kai: "*Kanaanäische und aramäische Inschriften*: the standard numbered collection of Canaanite and Aramaic inscriptions."
hazrak: "Hatarikka, biblical Hadrach (Zechariah 9:1): the northern Syrian city where Zakkur was besieged."
baalshamayin: "“Lord of Heaven”: a West Semitic sky god, Zakkur's patron."
chozeh: "Hebrew for a seer or visionary; in older biblical usage, a prophet."
imra: "*Immera*: Aramaic for a lamb."

# Added for weakness-is-greatness
chava: "Eve, the first woman (Genesis 2–3)."
kashering: "Making a utensil fit for kosher use by purging what it absorbed, usually with heat."
mashiach: "The Messiah: the anointed king from the house of David who will bring the redemption."
yeravam: "Jeroboam, first king of the northern kingdom of Israel, who set up golden calves at Bethel and Dan (1 Kings 12)."
mashiach-ben-yosef: "Messiah son of Joseph: in rabbinic tradition, a messianic figure from the tribe of Joseph who is killed before the final redemption."
mashiach-ben-david: "Messiah son of David: the messianic king of the final redemption."
bruriah: "A learned woman of the second century, wife of Rabbi Meir, quoted in the Talmud on matters of law and Scripture."
rabbi-meir: "A leading sage of the Mishnah in the second century, student of Rabbi Akiva."
maharatz-chayot: "Rabbi Tzvi Hirsch Chajes (1805–1855), Galician rabbi and scholar, author of glosses on the Talmud."
elisha: "The prophet Elisha, Eliyahu's disciple and successor (1 Kings 19–2 Kings 13)."
rodef: "A pursuer: someone actively threatening another's life, whom halacha permits stopping by force."
olam-haba: "The World to Come."
ketzot: "*Ketzot HaChoshen*, Rabbi Aryeh Leib Heller's commentary on the civil-law section of the Shulchan Aruch, famous for its intricate analysis."
abaye: "A leading Babylonian sage of the fourth century, head of the academy at Pumbedita."
chafetz-chaim: "Rabbi Yisrael Meir Kagan (1838–1933), author of the *Chafetz Chaim* on the laws of lashon hara and the *Mishnah Berurah*."
neviim: "Prophets (sing. *navi*); also the second section of Tanach, the books of the Prophets."
chiddush: "A novel insight or ruling in Torah (pl. *chiddushim*)."
beit-hamikdash: "The Temple in Jerusalem."
heter: "A halachic permission or leniency."
tefillah: "Prayer."
zocheh: "Merits; is granted a reward or privilege (noun: *zechut*)."
geulah: "The redemption."
teshuvat-hamishkal: "“Weighed repentance”: repentance proportioned to the sin it repairs."
rambam: "Rabbi Moshe ben Maimon (Maimonides, 1138–1204), author of the legal code *Mishneh Torah*."
yichud: "The prohibition on a man and a woman not married to each other being secluded together."
treif: "Not kosher; literally “torn,” of an animal unfit to eat."
gechazi: "Elisha's servant, who was struck with leprosy for taking Naaman's gift (2 Kings 5)."
tikkun: "Repair, rectification; in teshuvah, the repair of what a sin damaged."
drasha: "An interpretation that draws meaning from a verse beyond its plain sense (pl. *drashot*)."
tehillim: "The Book of Psalms."
chesaron: "A deficiency or lack; the opposite of a *maalah*."
nisayon: "A test or trial of character (pl. *nisyonot*)."
