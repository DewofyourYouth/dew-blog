# Newsletter topics and the copy for the in-post signup card (join-channels).
#
# topics: one Brevo list per checkbox on the doyy-subscribe form (field lists_25[]).
# Each topic list gets its own Brevo RSS integration fed by its category feed
# (/categories/<slug>/index.xml); "Everything" is the original list fed by /index.xml.
# A post's own category is ticked by default; posts in other categories tick Everything.
#
# Copy lookup order: shortcode heading/sub params, then the post's series, then its
# first category, then the card's built-in default.

field: "lists_25[]"

topics:
  - id: 11
    label: "Torah"
    category: "Faith & Practice"
  - id: 12
    label: "Languages"
    category: "Learning & Languages"
  - id: 13
    label: "Family history"
    category: "Heritage & Identity"
  - id: 5
    label: "Everything"
    everything: true

series:
  semitic-languages:
    heading: "Reading the Semitic languages, one at a time"
    sub: "Get each new reading by email when it’s posted."
  tzidkat-hatzaddik:
    heading: "Learning Tzidkat HaTzaddik with my father"
    sub: "Get new posts from our sessions by email."
  shore-saranduk:
    heading: "Following the Saranduk family through the records"
    sub: "Get new findings by email when they’re posted."

categories:
  Faith & Practice:
    heading: "Get new Torah posts by email"
    sub: "One short email per post."
  Learning & Languages:
    heading: "Get new language posts by email"
    sub: "Arabic, Hebrew, Aramaic and how I learn them, one short email per post."
  Heritage & Identity:
    heading: "Get new family-history posts by email"
    sub: "One short email per post, with the records shown."
  Tech & Tools:
    heading: "Get new posts by email"
    sub: "One short email per post, including the occasional script that almost worked."
